<script>
var U=React.useState,EF=React.useEffect,UR=React.useRef,h=React.createElement,FR=React.Fragment;

var AVATARS=['linear-gradient(135deg,#8a2be2,#ec4899)','linear-gradient(135deg,#00e5ff,#0066ff)','linear-gradient(135deg,#00e676,#00bfa5)','linear-gradient(135deg,#ffd600,#ff9800)','linear-gradient(135deg,#ff2d2d,#ff6b00)','linear-gradient(135deg,#e040fb,#7c4dff)'];

function load(k,d){try{var v=localStorage.getItem('hl_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}

function showToast(msg){var el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.style.display='none';},2500);}

  var sp=U('landing');var page=sp[0];var setPage=sp[1];

    )):null,
    h('div',{style:{display:age?'block':'none'}},
      h('div',{id:'toast',className:'toast',style:{display:'none'}}),
      page==='landing'?h(Landing,{nav:nav}):null,
      page==='auth'?h(Auth,{onLogin:login}):null,
      page==='home'?h(Home,{nav:nav,user:user,setUser:setUser,navDm:navDm}):null,
      page==='live'?h(LivePage,{lid:lid,user:user,setUser:setUser,nav:nav,navDm:navDm}):null,
      page==='dashboard'?h(Dash,{user:user,nav:nav,setUser:setUser}):null,

    }))

function Dash(p){

  var kycStep=U(0);var step=kycStep[0];var setStep=kycStep[1];
  var docF=U(null);var docFile=docF[0];var setDocFile=docF[1];
  var selfie=U(null);var selfieImg=selfie[0];var setSelfie=selfie[1];
  var loadState=U(false);var loading=loadState[0];var setLoading=loadState[1];
  var vidRef=UR(null);var camStream=UR(null);
  var users=getUsers();var u=users.find(function(x){return x.id===p.user.id});

  function pickDoc(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(ev){setDocFile(ev.target.result);};r.readAsDataURL(file);}
  function captureSelfie(){navigator.mediaDevices.getUserMedia({video:true}).then(function(s){camStream.current=s;if(vidRef.current)vidRef.current.srcObject=s;}).catch(function(){setSelfie(AVATARS[p.user.av]);setStep(3);setLoading(true);setTimeout(function(){setLoading(false);setStep(4);if(u){u.verified=true;saveUsers(users);p.setUser(Object.assign({},u));}showToast('✅ Verificado!');},2000);});}
  function confirmSelfie(){if(camStream.current)camStream.current.getTracks().forEach(function(t){t.stop();});var c=document.createElement('canvas');c.width=160;c.height=200;if(vidRef.current){var ctx=c.getContext('2d');ctx.drawImage(vidRef.current,0,0,160,200);setSelfie(c.toDataURL());}else{setSelfie(AVATARS[p.user.av]);}setStep(3);setLoading(true);setTimeout(function(){setLoading(false);setStep(4);if(u){u.verified=true;saveUsers(users);p.setUser(Object.assign({},u));}showToast('✅ Verificado!');},2500);}
  EF(function(){return function(){if(camStream.current)camStream.current.getTracks().forEach(function(t){t.stop();});};},[]);

  return h('div',{className:'dash page'},
    h('h1',null,'📊 ',h('span',{style:{color:'#a855f7'}},'Dashboard')),
    h('div',{className:'dgrid'},
      h('div',{className:'dcard cpur'},h('div',{className:'di'},'💰'),h('div',{className:'dn'},'R$ ',p.user.balance.toLocaleString()),h('div',{className:'dl'},'Saldo')),
      h('div',{className:'dcard cgld'},h('div',{className:'di'},'🎁'),h('div',{className:'dn'},'R$ ',p.user.totalEarn.toLocaleString()),h('div',{className:'dl'},'Total Ganho')),
      h('div',{className:'dcard cgrn'},h('div',{className:'di'},'👤'),h('div',{className:'dn'},p.user.followers),h('div',{className:'dl'},'Seguidores')),
      h('div',{className:'dcard cpnk'},h('div',{className:'di'},'🪙'),h('div',{className:'dn'},p.user.coins),h('div',{className:'dl'},'Moedas'))
    ),
    h('div',{style:{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap'}},
      h('button',{className:'btn btnp',onClick:function(){p.nav('wallet');}},'💰 Sacar PIX'),
      p.user.verified?h('span',{className:'verify-badge',style:{fontSize:14,padding:'8px 16px'}},'✔️ Verificado'):h('button',{className:'btn btno',style:{borderColor:'#0096ff',color:'#0096ff'},onClick:function(){setStep(1);}},'🔐 Verificar Identidade')
    ),
    h('div',{className:'dsec'},h('h3',null,'📋 Ganhos'),myTx.length===0?h('p',{style:{color:'#888',fontSize:13}},'Nenhuma transação.'):h('table',{className:'dtable'},
      h('thead',null,h('tr',null,h('th',null,'Data'),h('th',null,'De'),h('th',null,'Presente'),h('th',null,'Valor'))),
      h('tbody',null,myTx.map(function(t){return h('tr',{key:t.id},h('td',{style:{color:'#888'}},t.date),h('td',{style:{color:'#a855f7'}},t.from),h('td',null,'🎁 ',t.gift),h('td',{style:{color:'#00e676',fontWeight:700}},'+R$ ',t.amount));}))
    )),
    step>0?h('div',{className:'modal-bg',onClick:function(){setStep(0);}},
      h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},
        h('h2',null,'🔐 Verificação de Identidade'),
        step===1?h('div',{className:'kyc-step'},
          h('div',{style:{fontSize:40,marginBottom:12}},'📄'),
          h('p',{style:{color:'#888',marginBottom:16}},'Etapa 1/3: Foto do documento (RG ou CNH)'),
          docFile?h('img',{src:docFile,style:{maxWidth:280,maxHeight:180,borderRadius:12,marginBottom:12}}):null,
          h('label',{className:'btn btno',style:{cursor:'pointer'}},'📷 Escolher Documento',h('input',{type:'file',accept:'image/*',style:{display:'none'},onChange:pickDoc})),
          docFile?h('button',{className:'btn btnp',style:{marginLeft:10},onClick:function(){setStep(2);}},'Próximo →'):null
        ):step===2?h('div',{className:'kyc-step'},
          h('div',{style:{fontSize:40,marginBottom:12}},'🤳'),
          h('p',{style:{color:'#888',marginBottom:16}},'Etapa 2/3: Tire uma selfie'),
          h('div',{className:'kyc-oval'},selfieImg?h('img',{src:selfieImg}):h('video',{ref:vidRef,autoPlay:true,muted:true,playsInline:true,style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}})),
          selfieImg?h('button',{className:'btn btnp',onClick:confirmSelfie},'✅ Confirmar'):h('button',{className:'btn btnp',onClick:captureSelfie},'📸 Capturar Selfie'),
          h('button',{className:'btn btno',style:{marginTop:8},onClick:function(){setStep(1);}},'← Voltar')
        ):step===3?h('div',{className:'kyc-step'},

            h('p',{style:{color:'#888',fontSize:12}},'Verificação automática')

function Wallet(p){
  var st=U('buy');var tab=st[0];var setTab=st[1];
  var sa=U('');var amt=sa[0];var setAmt=sa[1];
  if(!p.user){p.nav('auth');return null;}
  var packs=[{coins:100,price:10},{coins:500,price:45,b:'+10%'},{coins:1000,price:80,b:'+20%'},{coins:5000,price:350,b:'+30%'},{coins:10000,price:650,b:'+40%'}];
  function buy(pk){var b=parseInt((pk.b||'0').replace(/[^0-9]/g,''))||0;p.user.coins+=Math.floor(pk.coins*(1+b/100));var users=getUsers();var u=users.find(function(x){return x.id===p.user.id});if(u)u.coins=p.user.coins;saveUsers(users);p.setUser(Object.assign({},p.user));showToast('✅ +'+pk.coins+' moedas!');}
  return h('div',{className:'dash page'},
    h('h1',null,'💰 ',h('span',{style:{color:'#a855f7'}},'Carteira')),
    h('div',{className:'walbal'},
      h('div',{style:{fontSize:13,color:'#888'}},'Saldo'),
      h('div',{className:'wa'},'R$ ',p.user.balance.toLocaleString()),
      h('div',{style:{fontSize:12,color:'#888'}},'🪙 ',p.user.coins,' moedas'),
      h('div',{style:{display:'flex',gap:10,justifyContent:'center',marginTop:16,flexWrap:'wrap'}},
        h('button',{className:'btn btng',onClick:function(){setTab('buy');}},'🛒 Comprar'),
        h('button',{className:'btn btngold',onClick:function(){setTab('withdraw');}},'💸 Sacar')
      )
    ),
    tab==='buy'?h('div',{className:'dsec'},h('h3',null,'🛒 Comprar Moedas'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10}},
        packs.map(function(pk,i){return h('div',{key:i,className:'coinpack',onClick:function(){buy(pk);}},
          h('div',{style:{fontSize:20}},'🪙'),h('div',{style:{fontSize:20,fontWeight:900,color:'#ffd600'}},pk.coins.toLocaleString()),
          h('div',{style:{fontSize:14,color:'#fff',margin:'4px 0'}},'R$ ',pk.price),pk.b?h('div',{style:{fontSize:10,color:'#00e676'}},'🎁 ',pk.b):null
        );})
      )
    ):h('div',{className:'dsec'},h('h3',null,'💸 Sacar via PIX'),
      h('div',{className:'fg'},h('label',null,'Chave PIX'),h('input',{value:p.user.email,readOnly:true,style:{opacity:.7}})),
      h('div',{className:'fg'},h('label',null,'Valor'),h('input',{type:'number',value:amt,onChange:function(e){setAmt(e.target.value);},placeholder:'R$ 0,00',min:'50'})),
      h('button',{className:'btn btngold',onClick:function(){if(parseFloat(amt)>=50&&parseFloat(amt)<=p.user.balance){p.user.balance-=parseFloat(amt);var users=getUsers();var u=users.find(function(x){return x.id===p.user.id});if(u)u.balance=p.user.balance;saveUsers(users);p.setUser(Object.assign({},p.user));showToast('✅ Saque de R$ '+amt+'!');setAmt('');}else{showToast('❌ Valor inválido');}}},'Solicitar Saque')
    )
  );

function Rank(){
  var cr=getUsers().filter(function(u){return u.isCreator||u.totalEarn>0;}).sort(function(a,b){return b.totalEarn-a.totalEarn;});
  if(cr.length===0)cr=getUsers().sort(function(a,b){return b.followers-a.followers;});
  return h('div',{className:'dash page'},
    h('h1',null,'🏆 ',h('span',{style:{color:'#a855f7'}},'Ranking')),
    cr.length===0?h('div',{style:{textAlign:'center',padding:40,color:'#555'}},'Nenhum criador ainda.'):cr.map(function(c,i){
      return h('div',{key:c.id,className:'rankitem'},
        h('div',{className:'rkpos'+(i===0?' r1':i===1?' r2':i===2?' r3':'')},'#',i+1),

}
