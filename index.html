function App(){

  var sa=_s(localStorage.getItem('hl18')==='1');var age=sa[0];var setAge=sa[1];
  var su=_s(null);var user=su[0];var setUser=su[1];
  var sl=_s(null);var lid=sl[0];var setLid=sl[1];

  function nav(p,id){setPage(p);if(id!==undefined)setLid(id);window.scrollTo(0,0);}
  function login(u){setUser(u);nav('home');}
  function logout(){setUser(null);nav('landing');}

  return h(React.Fragment,null,
    !age ? h(AgeGate,{ok:function(){setAge(true);localStorage.setItem('hl18','1');}}) : null,
    h('div',{style:{display:age?'block':'none'}},
      h(Nav,{user:user,onLogout:logout,page:page,nav:nav}),

        h('div',{className:'fl'},h('a',{href:'#'},'Termos'),h('a',{href:'#'},'Privacidade'),h('a',{href:'#'},'LGPD'))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(h(App,null));
