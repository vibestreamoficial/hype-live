<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>HYPE LIVE 18+ - Live Streaming</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0a0a;color:#e0e0e0;font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#8a2be2;border-radius:3px}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;outline:none}
input,textarea{font-family:'Inter',sans-serif;outline:none}
a{color:#a855f7;text-decoration:none}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:5000;background:#14141e;border:1px solid #8a2be2;color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:600;animation:toastIn .3s;pointer-events:none;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal{background:#14141e;border:1px solid #2a2a38;border-radius:20px;padding:28px;max-width:440px;width:92%;max-height:85vh;overflow-y:auto;animation:modalIn .3s}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal h2{font-size:20px;font-weight:900;margin-bottom:16px;color:#fff}
.modal .close{position:absolute;top:12px;right:16px;font-size:20px;color:#888;cursor:pointer;background:none;border:none}

/* AGE GATE */
.agegate{position:fixed;inset:0;z-index:2000;background:#0a0a0a;display:flex;align-items:center;justify-content:center}
.agebox{background:#14141e;border:1px solid #2a2a38;border-radius:24px;padding:40px 32px;text-align:center;max-width:420px;width:92%}
.agebox h1{font-size:28px;font-weight:900;margin-bottom:12px}
.agebox .warn{font-size:14px;color:#888;line-height:1.6;margin-bottom:6px}
.agebox .warn strong{color:#fff}
.agebtns{display:flex;gap:12px;margin:24px 0 16px}
.agebtns button{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;transition:.3s}
.ageyes{background:linear-gradient(135deg,#8a2be2,#ec4899);color:#fff}
.ageno{background:#1a1a24;color:#888;border:1px solid #2a2a38}

/* NAV */
.nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-bottom:1px solid #1a1a24;height:56px;display:flex;align-items:center;padding:0 16px}
.navlogo{font-size:20px;font-weight:900;color:#a855f7;cursor:pointer}.navlogo b{color:#ec4899}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px}
.navlink{color:#888;font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px;cursor:pointer;transition:.3s;white-space:nowrap}
.navlink:hover,.navlink.on{color:#a855f7;background:rgba(138,43,226,.1)}
.navav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;cursor:pointer;flex-shrink:0}
.bnav{position:fixed;bottom:0;width:100%;z-index:100;background:rgba(10,10,15,.95);border-top:1px solid #1a1a24;height:56px;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:8px;cursor:pointer;color:#888;font-size:10px;transition:.3s}
.bnav-item.on{color:#a855f7}
.bnav-item .bi{font-size:20px}

/* BUTTONS */
.btn{padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btnp{background:linear-gradient(135deg,#8a2be2,#ec4899);color:#fff;box-shadow:0 4px 20px rgba(138,43,226,.3)}
.btnp:hover{transform:translateY(-2px)}
.btno{background:transparent;color:#a855f7;border:2px solid #8a2be2}
.btno:hover{background:#8a2be2;color:#fff}
.btnsm{padding:8px 14px;font-size:12px;border-radius:8px}
.btng{background:#00e676;color:#000}
.btnr{background:#ff2d2d;color:#fff}
.btngold{background:linear-gradient(135deg,#ffd600,#ff9800);color:#000}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bred{background:rgba(255,45,45,.15);color:#ff2d2d}
.bpur{background:rgba(138,43,226,.15);color:#a855f7}
.bgrn{background:rgba(0,230,118,.15);color:#00e676}
.bgld{background:rgba(255,214,0,.15);color:#ffd600}

/* FORMS */
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:600}
.fg input,.fg textarea{width:100%;padding:10px 14px;background:#1a1a24;border:2px solid #2a2a38;border-radius:10px;color:#fff;font-size:14px;transition:.3s}
.fg input:focus,.fg textarea:focus{border-color:#8a2be2}
.fg textarea{resize:vertical;min-height:60px}

/* PAGE */
.page{min-height:100vh;padding-bottom:70px}

/* LANDING */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 20px;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(138,43,226,.07),transparent 60%);pointer-events:none}
.heroc{text-align:center;max-width:680px;position:relative;z-index:1}
.heroc h1{font-size:clamp(32px,7vw,56px);font-weight:900;line-height:1.1;margin-bottom:14px}
.heroc p{font-size:17px;color:#888;margin-bottom:28px;line-height:1.6}
.hero18{display:inline-flex;align-items:center;gap:6px;background:rgba(255,45,45,.08);border:1px solid rgba(255,45,45,.25);padding:6px 14px;border-radius:20px;font-size:12px;color:#ff2d2d;margin-bottom:20px}
.herobtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.feat{max-width:1000px;margin:0 auto;padding:60px 20px}
.feat h2{text-align:center;font-size:28px;font-weight:900;margin-bottom:40px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.fcard{background:#14141e;border:1px solid #2a2a38;border-radius:16px;padding:24px;transition:.3s}
.fcard:hover{border-color:#8a2be2;transform:translateY(-3px)}
.fcard .fi{font-size:32px;margin-bottom:10px}
.fcard h3{font-size:17px;font-weight:700;color:#fff;margin-bottom:4px}
.fcard p{font-size:13px;color:#888;line-height:1.5}

/* AUTH */
.authp{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 16px}
.authbox{background:#14141e;border:1px solid #2a2a38;border-radius:20px;padding:32px;max-width:420px;width:100%}
.authbox h2{font-size:22px;font-weight:900;text-align:center;margin-bottom:20px}
.authtabs{display:flex;border-radius:10px;overflow:hidden;border:1px solid #2a2a38;margin-bottom:20px}
.authtab{flex:1;padding:10px;text-align:center;font-weight:700;font-size:13px;cursor:pointer;background:#1a1a24;color:#888;transition:.3s}
.authtab.on{background:#8a2be2;color:#fff}
.ferr{color:#ff2d2d;font-size:12px;text-align:center;padding:8px;background:rgba(255,45,45,.08);border-radius:8px;margin-bottom:12px}

/* HOME */
.filterbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filterbtn{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;background:#1a1a24;color:#888;border:1px solid #2a2a38}
.filterbtn.on{background:#8a2be2;color:#fff;border-color:#8a2be2}
.livecard{background:#14141e;border:1px solid #2a2a38;border-radius:14px;overflow:hidden;cursor:pointer;transition:.3s}
.livecard:hover{border-color:#8a2be2;transform:translateY(-2px)}

/* LIVE */
.livewrap{padding-top:56px;height:100vh;display:flex;flex-direction:column}
.livemain{flex:1;display:flex;min-height:0}
.liveplayer{flex:1;background:#0a0a0a;position:relative;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.liveplayer::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#8a2be220,#0a0a0a,#ec489910);animation:lg 6s ease infinite}
@keyframes lg{0%,100%{background:linear-gradient(135deg,#8a2be220,#0a0a0a,#ec489910)}50%{background:linear-gradient(135deg,#ec489915,#0a0a0a,#8a2be225)}}
.liveplayer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.demolay{position:relative;z-index:2;text-align:center;padding:20px}
.demoliveicon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#8a2be2,#ec4899);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}
.liveoverlays{position:absolute;inset:0;z-index:5;pointer-events:none}
.lotop{position:absolute;top:12px;left:12px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}
.locreator{position:absolute;bottom:12px;left:12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:12px;pointer-events:auto}
.locreator .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.locreator .nm{color:#fff;font-weight:700;font-size:13px}
.locreator .fol{margin-left:6px;padding:4px 10px;border-radius:8px;background:#8a2be2;color:#fff;font-size:11px;font-weight:700;cursor:pointer;border:none}
.camerr{background:rgba(255,45,45,.1);border:1px solid rgba(255,45,45,.2);padding:8px 16px;border-radius:8px;font-size:12px;color:#ff2d2d}

/* CHAT */
.livechat{width:340px;background:#111;border-left:1px solid #1a1a24;display:flex;flex-direction:column;flex-shrink:0}
.chheader{padding:10px 14px;border-bottom:1px solid #1a1a24;font-weight:700;font-size:13px;color:#fff;display:flex;justify-content:space-between}
.chmsgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.chmsg{display:flex;gap:6px}
.chmsg .av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.chmsg .bd{flex:1}
.chmsg .au{font-size:11px;font-weight:700;margin-bottom:1px}
.chmsg .tx{font-size:12px;color:#aaa;line-height:1.4}
.chmsg.sys .tx{color:#ffd600;font-style:italic}
.chmsg.gift{background:rgba(138,43,226,.08);border:1px solid rgba(138,43,226,.15);border-radius:8px;padding:6px 10px}
.chmsg.gift .tx{color:#ec4899;font-weight:600}
.chinput{padding:10px 14px;border-top:1px solid #1a1a24;display:flex;gap:6px}
.chinput input{flex:1;padding:9px 12px;background:#1a1a24;border:1px solid #2a2a38;border-radius:8px;color:#fff;font-size:12px}
.chinput button{padding:9px 14px;border-radius:8px;background:#8a2be2;color:#fff;font-weight:700;font-size:12px}
.giftspanel{border-top:1px solid #1a1a24;padding:10px 14px;background:#111}
.giftsscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.giftitem{flex-shrink:0;text-align:center;cursor:pointer;padding:8px;border-radius:10px;border:2px solid transparent;transition:.2s;min-width:64px}
.giftitem:hover,.giftitem.sel{border-color:#8a2be2;background:rgba(138,43,226,.08)}
.giftitem .ge{font-size:24px}.giftitem .gn{font-size:9px;color:#888;margin-top:3px}.giftitem .gp{font-size:11px;font-weight:700;color:#ffd600}
.giftsend{width:100%;margin-top:8px;padding:10px;border-radius:10px;background:linear-gradient(135deg,#8a2be2,#ec4899);color:#fff;font-weight:700;font-size:13px;border:none}

/* KYC */
.kyc-step{text-align:center;padding:20px}
.kyc-oval{width:160px;height:200px;border:3px dashed #8a2be2;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:48px;color:#8a2be2;position:relative;overflow:hidden}
.kyc-oval img,.kyc-oval video{width:100%;height:100%;object-fit:cover;border-radius:50%}
.kyc-loading{display:flex;flex-direction:column;align-items:center;gap:16px}
.kyc-spinner{width:60px;height:60px;border:4px solid #2a2a38;border-top-color:#8a2be2;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kyc-done{font-size:64px;margin-bottom:16px}
.verify-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,150,255,.15);color:#0096ff;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}

/* DM PAGE */
.dmwrap{padding-top:56px;height:100vh;display:flex;flex-direction:column}
.dmlist{flex:1;overflow-y:auto;padding:12px 16px}
.dmitem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;cursor:pointer;transition:.2s;border:1px solid transparent}
.dmitem:hover{background:#1a1a24;border-color:#2a2a38}
.dmitem .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;position:relative}
.dmitem .online{position:absolute;bottom:0;right:0;width:10px;height:10px;background:#00e676;border-radius:50%;border:2px solid #14141e}
.dmitem .info{flex:1;min-width:0}
.dmitem .name{font-weight:700;color:#fff;font-size:14px}
.dmitem .last{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmitem .time{font-size:10px;color:#555;flex-shrink:0}
.dmitem .unread{background:#8a2be2;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dmchat{flex:1;display:flex;flex-direction:column}
.dmchat-header{padding:10px 16px;border-bottom:1px solid #1a1a24;display:flex;align-items:center;gap:10px}
.dmchat-header .back{font-size:20px;color:#888;cursor:pointer;background:none;border:none}
.dmchat-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.dm-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.4}
.dm-bubble.sent{align-self:flex-end;background:#8a2be2;color:#fff;border-bottom-right-radius:4px}
.dm-bubble.received{align-self:flex-start;background:#1a1a24;color:#fff;border-bottom-left-radius:4px}
.dm-bubble .dm-time{font-size:9px;opacity:.6;margin-top:4px}
.dmchat-input{padding:10px 16px;border-top:1px solid #1a1a24;display:flex;gap:6px}
.dmchat-input input{flex:1;padding:10px 14px;background:#1a1a24;border:1px solid #2a2a38;border-radius:20px;color:#fff;font-size:13px}
.dmchat-input button{padding:10px 16px;border-radius:20px;background:#8a2be2;color:#fff;font-weight:700;font-size:13px}

/* DASHBOARD */
.dash{padding-top:72px;max-width:1000px;margin:0 auto;padding-left:16px;padding-right:16px}
.dash h1{font-size:24px;font-weight:900;margin-bottom:20px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.dcard{background:#14141e;border:1px solid #2a2a38;border-radius:14px;padding:18px;text-align:center}
.dcard .di{font-size:26px;margin-bottom:4px}.dcard .dn{font-size:22px;font-weight:900;color:#fff}.dcard .dl{font-size:11px;color:#888;margin-top:2px}
.dcard.cpur{border-color:#8a2be2}.dcard.cgld{border-color:#ffd600}.dcard.cgrn{border-color:#00e676}.dcard.cpnk{border-color:#ec4899}
.dsec{background:#14141e;border:1px solid #2a2a38;border-radius:14px;padding:20px;margin-bottom:20px}
.dsec h3{font-size:16px;font-weight:700;color:#fff;margin-bottom:14px}
.dtable{width:100%;border-collapse:collapse}
.dtable th{text-align:left;padding:8px 10px;font-size:11px;color:#888;border-bottom:1px solid #2a2a38;text-transform:uppercase;letter-spacing:1px}
.dtable td{padding:8px 10px;font-size:12px;border-bottom:1px solid rgba(42,42,56,.3)}

/* WALLET */
.walbal{text-align:center;padding:32px;background:linear-gradient(135deg,rgba(138,43,226,.08),rgba(236,72,153,.04));border-radius:18px;border:1px solid #2a2a38;margin-bottom:20px}
.walbal .wa{font-size:42px;font-weight:900;color:#ffd600;margin:6px 0}
.coinpack{background:#14141e;border:1px solid #2a2a38;border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.3s}
.coinpack:hover{border-color:#8a2be2;transform:translateY(-2px)}

/* RANKING */
.rankitem{display:flex;align-items:center;gap:10px;padding:12px;background:#14141e;border:1px solid #2a2a38;border-radius:10px;margin-bottom:8px;transition:.3s}
.rankitem:hover{border-color:#8a2be2}
.rkpos{font-size:18px;font-weight:900;width:32px;text-align:center}
.rkpos.r1{color:#ffd600}.rkpos.r2{color:#c0c0c0}.rkpos.r3{color:#cd7f32}
.rkav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
.rkinfo{flex:1}.rkname{font-weight:700;color:#fff;font-size:13px}.rksub{font-size:11px;color:#888}
.rkamt{font-size:16px;font-weight:900;color:#ffd600}

/* AVATAR PICKER */
.avgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.avpick{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;cursor:pointer;border:3px solid transparent;transition:.2s}
.avpick.sel{border-color:#ffd600;transform:scale(1.1)}

@keyframes giftFloat{0%{opacity:1;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-50px) scale(1.3)}100%{opacity:0;transform:translateY(-100px) scale(.7)}}
.giftanim{position:fixed;font-size:44px;animation:giftFloat 1.4s forwards;pointer-events:none;z-index:3000}

footer{background:#111;border-top:1px solid #1a1a24;padding:30px 16px;text-align:center}
footer p{color:#555;font-size:11px;line-height:1.6}

@media(max-width:768px){
  .livemain{flex-direction:column}
  .livechat{width:100%;max-height:40vh;border-left:none;border-top:1px solid #1a1a24}
  .liveplayer{min-height:50vh}
  .dgrid{grid-template-columns:1fr 1fr}
  .heroc h1{font-size:28px}
  .navlink.hide-m{display:none}
  .dmwrap{flex-direction:column}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
var U=React.useState,EF=React.useEffect,UR=React.useRef,CC=React.createContext,UC=React.useContext,h=React.createElement,FR=React.Fragment;

/* ===== DADOS ===== */

var toastTimer=null;
function showToast(msg){
  var el=document.getElementById('toast');

  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.style.display='none';},2500);
}

/* ===== KYC MODAL ===== */
function KycModal(p){
  var step=U(1);var sStep=step[0];var setStep=step[1];
  var sf=U(null);var docFile=sf[0];var setDocFile=sf[1];
  var ss=U(null);var selfie=ss[0];var setSelfie=ss[1];
  var vidRef=UR(null);
  var camStream=UR(null);
  var sl=U(false);var loading=sl[0];var setLoading=sl[1];

  function pickDoc(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){setDocFile(ev.target.result);};
    reader.readAsDataURL(file);
  }
  function captureSelfie(){
    navigator.mediaDevices.getUserMedia({video:true}).then(function(stream){
      camStream.current=stream;if(vidRef.current)vidRef.current.srcObject=stream;
    }).catch(function(){
      setSelfie(AVATARS[p.user.av]);setStep(3);setLoading(true);
      setTimeout(function(){setLoading(false);setStep(4);p.onDone();showToast('✅ Identidade verificada!');},2000);
    });
  }
  function confirmSelfie(){
    if(camStream.current){camStream.current.getTracks().forEach(function(t){t.stop();});}
    var c=document.createElement('canvas');c.width=160;c.height=200;
    if(vidRef.current){var ctx=c.getContext('2d');ctx.drawImage(vidRef.current,0,0,160,200);setSelfie(c.toDataURL());}
    else{setSelfie(AVATARS[p.user.av]);}
    setStep(3);setLoading(true);
    setTimeout(function(){setLoading(false);setStep(4);
      var users=getUsers();var u=users.find(function(x){return x.id===p.user.id});if(u){u.verified=true;saveUsers(users);p.setUser(Object.assign({},u));}
      p.onDone();showToast('✅ Identidade verificada!');
    },2500);
  }

  EF(function(){return function(){if(camStream.current)camStream.current.getTracks().forEach(function(t){t.stop();});};},[]);

  return h('div',{className:'modal-bg',onClick:p.onClose},
    h('div',{className:'modal',style:{position:'relative'},onClick:function(e){e.stopPropagation();}},
      h('h2',null,'🔐 Verificação de Identidade'),

        docFile?h('img',{src:docFile,style:{maxWidth:280,maxHeight:180,borderRadius:12,marginBottom:12}}):null,
        h('label',{className:'btn btno',style:{cursor:'pointer'}},'📷 Escolher Documento',
          h('input',{type:'file',accept:'image/*',style:{display:'none'},onChange:pickDoc})
        ),
        docFile?h('button',{className:'btn btnp',style:{marginLeft:10},onClick:function(){setStep(2);}},'Próximo →'):null
      ):sStep===2?h('div',{className:'kyc-step'},
        h('div',{style:{fontSize:40,marginBottom:12}},'🤳'),
        h('p',{style:{color:'#888',marginBottom:16}},'Etapa 2/3: Tire uma selfie'),
        h('div',{className:'kyc-oval'},selfie?h('img',{src:selfie}):h('video',{ref:vidRef,autoPlay:true,muted:true,playsInline:true,style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}})),
        selfie?h('button',{className:'btn btnp',onClick:confirmSelfie},'✅ Confirmar Selfie'):h('button',{className:'btn btnp',onClick:captureSelfie},'📸 Capturar Selfie'),
        h('button',{className:'btn btno',style:{marginTop:8},onClick:function(){setStep(1);}},'← Voltar')
      ):sStep===3?h('div',{className:'kyc-step'},
        h('div',{className:'kyc-loading'},
          h('div',{className:'kyc-spinner'}),
          h('p',{style:{color:'#a855f7',fontWeight:700}},'Analisando rosto...'),
          h('p',{style:{color:'#888',fontSize:12}},'Verificação automática em alguns segundos')
        )
      ):h('div',{className:'kyc-step'},
        h('div',{className:'kyc-done'},'✅'),
        h('h3',{style:{color:'#0096ff',marginBottom:8}},'Identidade Verificada!'),

        h('button',{className:'btn btnp',style:{marginTop:16},onClick:p.onClose},'Fechar')
      )
    )
  );

/* ===== DM PAGE ===== */
function DmsPage(p){
  var dmData=getDms();var selected=U(p.dmUser);var sel=selected[0];var setSel=selected[1];
  var inputMsg=U('');var inMsg=inputMsg[0];var setInMsg=inputMsg[1];
  var users=getUsers();

  function sendDm(){
    if(!inMsg.trim()||!sel||!p.user)return;
    var key=[Math.min(p.user.id,sel.id),Math.max(p.user.id,sel.id)].join('_');
    if(!dmData[key])dmData[key]=[];
    dmData[key].push({from:p.user.id,text:inMsg,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),read:false});
    saveDms(dmData);setInMsg('');
  }
  function getConversations(){
    var convos=[];
    users.filter(function(u){return u.id!==p.user.id;}).forEach(function(u){
      var key=[Math.min(p.user.id,u.id),Math.max(p.user.id,u.id)].join('_');
      var msgs=dmData[key]||[];
      var last=msgs[msgs.length-1];
      var unread=msgs.filter(function(m){return m.from!==p.user.id&&!m.read;}).length;
      convos.push({user:u,lastMsg:last?last.text:'Iniciar conversa...',lastTime:last?last.time:'',unread:unread});
    });
    return convos.sort(function(a,b){return b.unread-a.unread;});
  }

  if(!sel){
    var convos=getConversations();
    return h('div',{className:'dmwrap'},
      h('div',{style:{padding:'12px 16px',borderBottom:'1px solid #1a1a24',display:'flex',alignItems:'center',gap:8}},
        h('span',{style:{fontWeight:900,fontSize:18,color:'#a855f7'}},'💬 Mensagens')
      ),
      h('div',{className:'dmlist'},
        convos.map(function(c){
          return h('div',{key:c.user.id,className:'dmitem',onClick:function(){setSel(c.user);}},
            h('div',{className:'av',style:{background:AVATARS[c.user.av]}},c.user.name[0],c.user.online?h('div',{className:'online'}):null),
            h('div',{className:'info'},h('div',{className:'name'},c.user.name,c.user.verified?' ✔️':''),h('div',{className:'last'},c.lastMsg)),
            h('div',{style:{textAlign:'right'}},c.lastTime?h('div',{className:'time'},c.lastTime):null,c.unread?h('div',{className:'unread'},c.unread):null)
          );
        })
      )
    );
  }

  var key=[Math.min(p.user.id,sel.id),Math.max(p.user.id,sel.id)].join('_');
  var chatMsgs=dmData[key]||[];

  return h('div',{className:'dmwrap'},
    h('div',{className:'dmchat'},
      h('div',{className:'dmchat-header'},
        h('button',{className:'back',onClick:function(){setSel(null);}},'←'),
        h('div',{className:'av',style:{background:AVATARS[sel.av],width:32,height:32,fontSize:12}},sel.name[0]),
        h('div',null,h('div',{style:{fontWeight:700,fontSize:14,color:'#fff'}},sel.name,sel.verified?' ✔️':''),h('div',{style:{fontSize:11,color:sel.online?'#00e676':'#888'}},sel.online?'Online':'Offline'))
      ),
      h('div',{className:'dmchat-msgs'},
        chatMsgs.length===0?h('div',{style:{textAlign:'center',color:'#555',fontSize:13,padding:40}},'Nenhuma mensagem ainda. Digite abaixo!'):null,
        chatMsgs.map(function(m,i){
          var isSent=m.from===p.user.id;
          return h('div',{key:i,className:'dm-bubble '+(isSent?'sent':'received')},
            m.text,
            h('div',{className:'dm-time'},m.time)
          );
        })
      ),
      h('div',{className:'dmchat-input'},
        h('input',{value:inMsg,onChange:function(e){setInMsg(e.target.value);},onKeyDown:function(e){if(e.key==='Enter')sendDm();},placeholder:'Mensagem...'}),
        h('button',{onClick:sendDm},'Enviar')
      )
    )
  );
}
